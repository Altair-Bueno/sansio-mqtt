[package]
name = "sansio-mqtt-v5-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Sans-IO MQTT v5.0 client state machine"
repository.workspace = true
keywords.workspace = true
categories = ["network-programming", "no-std"]

[dependencies]
bon = { workspace = true }
bytes = { workspace = true }
bytestring = { workspace = true }
encode = { workspace = true }
sansio = { workspace = true }
semver = { workspace = true }
sansio-mqtt-protocol = { workspace = true }
sansio-mqtt-v5-wire = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true, features = ["attributes"] }
winnow = { workspace = true }
serde = { workspace = true, optional = true, features = ["derive"] }
serde_with = { workspace = true, optional = true }

[features]
# `Deserialize` for `ClientSettings`, e.g. to read it from a config file.
serde = ["dep:serde", "dep:serde_with", "sansio-mqtt-protocol/serde"]

[lints]
workspace = true
