[package]
name = "sansio-mqtt-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Version-neutral application API (commands, events, messages) shared by the sansio-mqtt protocol crates"
repository.workspace = true
keywords.workspace = true
categories = ["network-programming", "no-std"]

[dependencies]
bon = { workspace = true }
bytes = { workspace = true }
bytestring = { workspace = true }
sansio = { workspace = true }
semver = { workspace = true }
thiserror = { workspace = true }
strum = { workspace = true, features = ["derive"] }
serde = { workspace = true, optional = true }
serde_repr = { workspace = true, optional = true }

[features]
# `Deserialize` for the settings types, e.g. to read them from a config file.
serde = ["dep:serde", "dep:serde_repr"]

[lints]
workspace = true
