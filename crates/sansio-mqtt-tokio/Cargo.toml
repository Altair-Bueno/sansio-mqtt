[package]
name = "sansio-mqtt-tokio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Tokio driver for the sansio-mqtt sans-I/O MQTT clients, with optional TLS and WebSocket transports"
repository.workspace = true
keywords.workspace = true
categories = ["network-programming", "asynchronous"]

[dependencies]
bytes = { workspace = true }
sansio-mqtt-protocol = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "time"] }
tracing = { workspace = true, features = ["std"] }
thiserror = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
futures-core = { workspace = true, optional = true }
futures-sink = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true, features = [
  "handshake",
] }

[features]
# `RustlsConnector`: TLS over any connector, using rustls. The application
# picks the crypto provider and protocol versions through its own `rustls`
# dependency.
tokio-rustls = ["dep:thiserror", "dep:tokio-rustls"]
# `TungsteniteConnector`: MQTT over WebSocket (MQTT v5.0 §6) over any
# connector, using tungstenite.
tokio-tungstenite = [
  "dep:futures-core",
  "dep:futures-sink",
  "dep:thiserror",
  "dep:tokio-tungstenite",
]

[dev-dependencies]
futures-util = { workspace = true, features = ["sink"] }
rcgen = { workspace = true, features = ["crypto", "ring"] }
rustls-platform-verifier = { workspace = true }
thiserror = { workspace = true }
usage-rs = { workspace = true, features = ["diagnostics", "help"] }
tokio-rustls = { workspace = true, features = ["ring"] }
sansio = { workspace = true }
semver = { workspace = true }
encode = { workspace = true }
sansio-mqtt-v5-protocol = { workspace = true }
sansio-mqtt-protocol = { workspace = true }
sansio-mqtt-v5-wire = { workspace = true }
winnow = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "signal",
  "sync",
  "test-util",
  "time",
] }

[[test]]
name = "rustls_connector"
required-features = ["tokio-rustls"]

[[test]]
name = "tungstenite_connector"
required-features = ["tokio-tungstenite"]

[[test]]
name = "tungstenite_rustls_connector"
required-features = ["tokio-rustls", "tokio-tungstenite"]

[[example]]
name = "client"
required-features = ["tokio-rustls", "tokio-tungstenite"]

[lints]
workspace = true
