[package]
name = "sansio-mqtt-tokio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
bytes = { workspace = true }
sansio-mqtt-protocol = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "time"] }
tracing = { workspace = true, features = ["attributes"] }
thiserror = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true, features = [
  "logging",
  "ring",
  "tls12",
] }
futures-core = { workspace = true, optional = true }
futures-sink = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true, features = [
  "handshake",
] }

[features]
# TLS over any connector, using rustls with the ring crypto provider.
rustls = ["dep:thiserror", "dep:tokio-rustls"]
# MQTT over WebSocket (MQTT v5.0 §6) over any connector.
websocket = [
  "dep:futures-core",
  "dep:futures-sink",
  "dep:thiserror",
  "dep:tokio-tungstenite",
]

[dev-dependencies]
futures-util = { workspace = true, features = ["sink"] }
rcgen = { workspace = true, features = ["crypto", "pem", "ring"] }
rustls-platform-verifier = { workspace = true }
tokio-rustls = { workspace = true, features = ["logging", "ring", "tls12"] }
sansio = { workspace = true }
semver = { workspace = true }
encode = { workspace = true }
sansio-mqtt-v5-protocol = { workspace = true }
sansio-mqtt-protocol = { workspace = true }
sansio-mqtt-v5-types = { workspace = true }
winnow = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
tokio = { workspace = true, features = ["full", "test-util"] }

[[example]]
name = "tlsv5"
required-features = ["rustls"]

[[test]]
name = "websocket_connector"
required-features = ["websocket"]

[[example]]
name = "wsv5"
required-features = ["websocket"]
