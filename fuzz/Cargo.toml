[package]
name = "sansio-mqtt-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { workspace = true }
sansio-mqtt-v5-types = { workspace = true }
winnow = { workspace = true, features = ["alloc"] }
encode = { workspace = true, features = ["alloc"] }

[[bin]]
name = "parse_control_packet"
path = "fuzz_targets/parse_control_packet.rs"
test = false
doc = false

[[bin]]
name = "roundtrip_control_packet"
path = "fuzz_targets/roundtrip_control_packet.rs"
test = false
doc = false
